version: "3.8"

services:
  mongodb:
    image: mongo:6
    container_name: webproject-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: webproject-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: WebProjectMessageDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: webproject-redis
    ports:
      - "6379:6379"
    restart: unless-stopped


volumes:
  mongo_data:
  postgres_data:
