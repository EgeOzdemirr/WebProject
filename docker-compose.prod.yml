services:
  mongodb:
    image: mongo:6
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  postgres:
    image: postgres:15
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "effective_cache_size=128MB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}"
      POSTGRES_DB: WebProjectMessageDb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  identityserver:
    build:
      context: .
      dockerfile: IdentityServer/WebProject.IdentityServer/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_gcServer: "0"
      CLIENT_SECRET: "${CLIENT_SECRET:?CLIENT_SECRET .env dosyasinda tanimli olmali}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
      SigningKeyPath: /keys/tempkey.jwk
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=WebProjectIdentityDb;User Id=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}"
    volumes:
      - identity_keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: ApiGateway/WebProject.OcelotGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_gcServer: "0"
      IdentityServerUrl: "http://identityserver"
    depends_on:
      - identityserver
    restart: unless-stopped

  discount:
    build:
      context: .
      dockerfile: Services/Discount/WebProject.Discount/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_gcServer: "0"
      IdentityServerUrl: "http://identityserver"
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=WebProjectDiscountDb;User Id=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  order:
    build:
      context: .
      dockerfile: Services/Order/Presentation/WebProject.Order.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_gcServer: "0"
      IdentityServerUrl: "http://identityserver"
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=WebProjectOrderDb;User Id=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cargo:
    build:
      context: .
      dockerfile: Services/Cargo/WebProject.Cargo.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_gcServer: "0"
      IdentityServerUrl: "http://identityserver"
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=WebProjectCargoDb;User Id=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  comment:
    build:
      context: .
      dockerfile: Services/Comment/WebProject.Comment/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_gcServer: "0"
      IdentityServerUrl: "http://identityserver"
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=WebProjectCommentDb;User Id=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: Services/Catalog/WebProject.Catalog/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_gcServer: "0"
      IdentityServerUrl: "http://identityserver"
      ConnectionStrings__OrderingDb: "Server=postgres;Port=5432;Database=WebProjectOrderDb;User Id=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}"
      ConnectionStrings__MongoDB: "mongodb://mongodb:27017"
      DatabaseSettings__ConnectionString: "mongodb://mongodb:27017"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  basket:
    build:
      context: .
      dockerfile: Services/Basket/WebProject.Basket/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_gcServer: "0"
      IdentityServerUrl: "http://identityserver"
      RedisSettings__Host: "redis"
      RedisSettings__Port: "6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  message:
    build:
      context: .
      dockerfile: Services/Message/WebProject.Message/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_gcServer: "0"
      IdentityServerUrl: "http://identityserver"
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=WebProjectMessageDb;User Id=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  recommendation:
    build:
      context: .
      dockerfile: Services/Recommendation/WebProject.Recommendation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_gcServer: "0"
      IdentityServerUrl: "http://identityserver"
      MongoDb__ConnectionString: "mongodb://mongodb:27017"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  webui:
    build:
      context: .
      dockerfile: Frontends/WebProject.WebUI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_gcServer: "0"
      ServiceApiSettings__OcelotUrl: "http://gateway"
      ServiceApiSettings__IdentityServerUrl: "http://identityserver"
      ClientSettings__WebProjectVisitorClient__ClientSecret: "${CLIENT_SECRET:?CLIENT_SECRET .env dosyasinda tanimli olmali}"
      ClientSettings__WebProjectManagerClient__ClientSecret: "${CLIENT_SECRET:?CLIENT_SECRET .env dosyasinda tanimli olmali}"
      ClientSettings__WebProjectAdminClient__ClientSecret: "${CLIENT_SECRET:?CLIENT_SECRET .env dosyasinda tanimli olmali}"
      AllowedOrigins__0: "${PUBLIC_URL:-http://localhost}"
    ports:
      - "80:80"
    depends_on:
      - gateway
      - identityserver
    restart: unless-stopped

volumes:
  mongo_data:
  postgres_data:
  identity_keys:
