name: allinone-image

# Tek-container imajını (deploy/allinone) amd64 için derleyip GitHub Container Registry'ye yükler.
# Sunucu derlemek yerine bu imajı çeker (e2-micro üzerinde derleme çok yavaş/bellek açısından zor).
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ["**.md", "scripts/**"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/allinone/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/egeozdemirr/webproject-allinone:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
